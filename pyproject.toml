[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-blocks"
version = "0.1.0"
description = "Demand-driven context engine for enterprise AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Raj Navakoti", email = "rajnavakoti@gmail.com" },
]
keywords = ["ai", "agents", "context", "enterprise", "knowledge-base", "ddc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "instructor>=1.3.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
pdf = ["pypdf>=4.0.0"]
local-embeddings = ["fastembed>=0.3.0"]
mcp = ["mcp[cli]>=1.0.0,<2.0.0"]
all = ["context-blocks[gemini,pdf,local-embeddings,mcp]"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
context-blocks = "context_blocks.cli:app"
cb = "context_blocks.cli:app"

[project.urls]
Homepage = "https://github.com/ea-toolkit/context-blocks"
Documentation = "https://github.com/ea-toolkit/ddc"
Repository = "https://github.com/ea-toolkit/context-blocks"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
